name: Reusable Package Operations

on:
  workflow_call:

    inputs:

      environment:
        description: Target GitHub environment
        required: true
        type: string

      package_name:
        description: Package name
        required: true
        type: string

      dry_run:
        description: Execute deployment as dry run
        required: true
        type: boolean

jobs:

  package:

    name: Package Operations

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    permissions:
      contents: read

    env:

      # Environment variables configured in
      # GitHub Settings -> Environments -> dev
      API_BASE_URL: ${{ vars.API_BASE_URL }}

      CREATE_API: ${{ vars.CREATE_API }}
      DISTRIBUTE_API: ${{ vars.DISTRIBUTE_API }}
      DOWNLOAD_API: ${{ vars.DOWNLOAD_API }}
      UPLOAD_API: ${{ vars.UPLOAD_API }}
      DEPLOY_API: ${{ vars.DEPLOY_API }}
      ADMIN_API: ${{ vars.ADMIN_API }}
      CLEANUP_API: ${{ vars.CLEANUP_API }}

      PACKAGE_NAME: ${{ inputs.package_name }}

      DRY_RUN: ${{ inputs.dry_run }}

    steps:

      # ------------------------------------------------
      # 1. CHECK CONFIGURATION
      # ------------------------------------------------

      - name: Validate API configuration
        shell: bash
        run: |

          set -euo pipefail

          echo "Environment:"
          echo "${{ inputs.environment }}"

          echo "API Base URL:"
          echo "$API_BASE_URL"

          echo "Create API:"
          echo "$CREATE_API"

          echo "Distribute API:"
          echo "$DISTRIBUTE_API"

          echo "Download API:"
          echo "$DOWNLOAD_API"

          echo "Upload API:"
          echo "$UPLOAD_API"

          echo "Deploy API:"
          echo "$DEPLOY_API"

          echo "Admin API:"
          echo "$ADMIN_API"

          echo "Cleanup API:"
          echo "$CLEANUP_API"

      # ------------------------------------------------
      # 2. CREATE PACKAGE
      # ------------------------------------------------

      - name: Create package
        id: create
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p package

          cat > package/manifest.json <<EOF
          {
            "package": "$PACKAGE_NAME",
            "environment": "${{ inputs.environment }}",
            "run_id": "$GITHUB_RUN_ID"
          }
          EOF

          echo "Calling:"
          echo "$API_BASE_URL$CREATE_API"

          curl \
            --fail-with-body \
            --retry 3 \
            -sS \
            -X POST \
            "$API_BASE_URL$CREATE_API" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "Create package",
              "body": "DEV dry run",
              "userId": 1
            }' \
            -o package/create-response.json

          cat package/create-response.json

          zip -r "${PACKAGE_NAME}.zip" package

          echo "package_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------
      # 3. DISTRIBUTE PACKAGE
      # ------------------------------------------------

      - name: Distribute package
        shell: bash
        run: |

          set -euo pipefail

          echo "Calling:"
          echo "$API_BASE_URL$DISTRIBUTE_API"

          curl \
            --fail-with-body \
            --retry 3 \
            -sS \
            "$API_BASE_URL$DISTRIBUTE_API" \
            -o distribution-response.json

          cat distribution-response.json

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_name }}-${{ github.run_id }}
          path: ${{ inputs.package_name }}.zip
          retention-days: 7

      # ------------------------------------------------
      # 4. DOWNLOAD PACKAGE
      # ------------------------------------------------

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package_name }}-${{ github.run_id }}
          path: downloaded

      - name: Validate downloaded package
        shell: bash
        run: |

          set -euo pipefail

          unzip -t \
            "downloaded/${PACKAGE_NAME}.zip"

          echo "Package download successful."

      # ------------------------------------------------
      # 5. UPLOAD PACKAGE
      # ------------------------------------------------

      - name: Upload package
        shell: bash
        run: |

          set -euo pipefail

          echo "Calling:"
          echo "$API_BASE_URL$UPLOAD_API"

          curl \
            --fail-with-body \
            --retry 3 \
            -sS \
            -X POST \
            "$API_BASE_URL$UPLOAD_API" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "Upload package",
              "body": "Package upload dry run",
              "userId": 1
            }' \
            -o upload-response.json

          cat upload-response.json

      # ------------------------------------------------
      # 6. ADMIN MODE
      # ------------------------------------------------

      - name: Admin mode
        shell: bash
        run: |

          set -euo pipefail

          echo "Calling:"
          echo "$API_BASE_URL$ADMIN_API"

          if [[ "$DRY_RUN" == "true" ]]; then

            echo "DRY RUN:"
            echo "Admin mode would be enabled."

          else

            curl \
              --fail-with-body \
              --retry 3 \
              -sS \
              -X PATCH \
              "$API_BASE_URL$ADMIN_API" \
              -H "Content-Type: application/json" \
              -d '{
                "title": "Admin mode enabled"
              }'

          fi

      # ------------------------------------------------
      # 7. DEPLOY PACKAGE
      # ------------------------------------------------

      - name: Deploy package
        shell: bash
        run: |

          set -euo pipefail

          echo "Calling:"
          echo "$API_BASE_URL$DEPLOY_API"

          if [[ "$DRY_RUN" == "true" ]]; then

            echo "======================================"
            echo "DRY RUN DEPLOYMENT"
            echo "======================================"

            echo "Package:"
            echo "$PACKAGE_NAME"

            echo "Environment:"
            echo "${{ inputs.environment }}"

            echo "Deployment API:"
            echo "$API_BASE_URL$DEPLOY_API"

            echo "No actual deployment performed."

          else

            curl \
              --fail-with-body \
              --retry 3 \
              -sS \
              -X PATCH \
              "$API_BASE_URL$DEPLOY_API" \
              -H "Content-Type: application/json" \
              -d '{
                "title": "Package deployed"
              }'

          fi

      # ------------------------------------------------
      # 8. CLEANUP
      # ------------------------------------------------

      - name: Cleanup
        if: always()
        shell: bash
        run: |

          echo "Calling:"
          echo "$API_BASE_URL$CLEANUP_API"

          if [[ "$DRY_RUN" == "true" ]]; then

            echo "DRY RUN:"
            echo "Cleanup API would be called."

          else

            curl \
              --fail-with-body \
              --retry 3 \
              -sS \
              -X DELETE \
              "$API_BASE_URL$CLEANUP_API"

          fi

          rm -rf package downloaded
          rm -f *.json *.zip

      # ------------------------------------------------
      # SUMMARY
      # ------------------------------------------------

      - name: Pipeline summary
        if: always()
        run: |

          echo "## Package Pipeline" >> "$GITHUB_STEP_SUMMARY"

          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ inputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | $PACKAGE_NAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry Run | $DRY_RUN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| API | $API_BASE_URL |" >> "$GITHUB_STEP_SUMMARY"
